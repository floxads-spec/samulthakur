
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAAN SURESHOT | Official Community</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', sans-serif;
  background: #07090d;
  color: #fff;
}

.page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px 16px;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 30%, rgba(190,130,30,.17), transparent 38%),
    linear-gradient(145deg,#080a0e,#11100b,#050608);
}

.glow {
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  background: #d99a28;
  filter: blur(140px);
  opacity: .18;
}

.card {
  width: 100%;
  max-width: 480px;
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 40px 24px;
  border: 1px solid rgba(222,173,73,.5);
  border-radius: 25px;
  background: rgba(15,17,20,.94);
  box-shadow: 0 0 55px rgba(212,155,45,.12);
}

.logo {
  width: 130px;
  height: 130px;
  margin: 0 auto 27px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  border: 2px solid #d9a43c;
  background: radial-gradient(circle,#30230e,#11100c 70%);
  box-shadow: 0 0 30px rgba(218,164,60,.25),
              inset 0 0 20px rgba(218,164,60,.15);
}

.logo svg {
  width: 94px;
  height: 94px;
}

.tag {
  display: inline-block;
  padding: 8px 18px;
  border: 1px solid #b98a35;
  border-radius: 30px;
  color: #e9c879;
  font-size: 11px;
  letter-spacing: 3px;
  margin-bottom: 20px;
}

h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(31px, 8vw, 43px);
  font-weight: 900;
  line-height: 1.25;
  letter-spacing: 2px;
  background: linear-gradient(90deg,#b98124,#fff0b0,#c18a29);
  -webkit-background-clip: text;
  color: transparent;
  text-shadow: 0 0 25px rgba(211,158,57,.12);
}

.line {
  width: 90px;
  height: 3px;
  margin: 22px auto;
  border-radius: 5px;
  background: linear-gradient(90deg,transparent,#e6b74d,transparent);
}

.description {
  color: #b7b7b7;
  font-size: 14px;
  line-height: 1.9;
  margin-bottom: 27px;
}

.cta {
  display: block;
  width: 100%;
  padding: 16px 12px;
  border-radius: 40px;
  background: linear-gradient(90deg,#b77b1d,#f3ce70,#b77b1d);
  color: #171006;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 1px;
  text-decoration: none;
  transition: .3s;
  box-shadow: 0 5px 25px rgba(222,169,65,.2);
}

.cta:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 32px rgba(222,169,65,.4);
}

.footer {
  margin-top: 30px;
  color: #77736a;
  font-size: 10px;
  letter-spacing: 3px;
}

.star {
  position: absolute;
  color: #e4b957;
  animation: blink 2s infinite;
}

.star.one { top: 15%; left: 12%; }
.star.two { top: 22%; right: 12%; }
.star.three { bottom: 15%; left: 15%; }
.star.four { bottom: 20%; right: 14%; }

@keyframes blink {
  0%,100% { opacity: .2; transform: scale(.7); }
  50% { opacity: 1; transform: scale(1.3); }
}

@media(max-width:480px) {
  .card { padding: 34px 20px; }
  .logo { width: 115px; height: 115px; }
  .logo svg { width: 82px; height: 82px; }
}
</style>
</head>

<body>

<main class="page">
<div class="glow"></div>

<span class="star one">✦</span>
<span class="star two">✧</span>
<span class="star three">✦</span>
<span class="star four">✧</span>

<section class="card">

<div class="logo">
<svg viewBox="0 0 100 100" fill="none"
xmlns="http://www.w3.org/2000/svg">

<path d="M50 7 L61 20 L79 17 L77 35 L92 48
L80 62 L83 81 L63 79 L50 94 L37 79
L17 81 L20 62 L8 48 L23 35 L21 17
L39 20 Z"
stroke="#E4B653" stroke-width="3"
fill="#241a0c"/>

<path d="M30 38 L50 23 L70 38 L66 65
L50 79 L34 65 Z"
stroke="#F6D47E" stroke-width="2"/>

<path d="M36 49 L46 60 L66 39"
stroke="#F6D47E" stroke-width="5"
stroke-linecap="round" stroke-linejoin="round"/>

<circle cx="50" cy="50" r="44"
stroke="#B9872F" stroke-width="1"
stroke-dasharray="3 5"/>
</svg>
</div>

<div class="tag">OFFICIAL COMMUNITY</div>

<h1>MAAN<br>SURESHOT</h1>

<div class="line"></div>

<p class="description">
Welcome to the official MAAN SURESHOT community.
Stay connected and explore community updates.
</p>

<a class="cta" href="#">
JOIN TELEGRAM COMMUNITY →
</a>

<div class="footer">
MAAN SURESHOT • OFFICIAL
</div>

</section>
</main>

</body>
</html>
